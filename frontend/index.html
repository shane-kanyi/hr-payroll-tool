<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR &amp; Payroll Tool</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card card">
      <h1>HR &amp; Payroll Tool</h1>
      <p class="muted small">Sign in to continue.</p>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password" />
      </div>
      <div class="field-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary" style="margin-top:8px; width:100%;">Sign in</button>
    </form>
  </section>

  <div id="app-shell" hidden>
    <header class="app-header">
      <div class="header-left">
        <h1>HR &amp; Payroll Tool</h1>
      </div>
      <div class="header-left">
        <span id="current-user-label" class="small muted"></span>
        <button id="logout-btn" class="btn btn-secondary btn-sm" type="button">Log out</button>
        <span id="api-status" class="status-pill status-pill--pending">checking API…</span>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="overview" type="button">Overview</button>
      <button class="tab-btn" data-tab="employees" type="button">Employees</button>
      <button class="tab-btn" data-tab="leave" type="button">Leave</button>
      <button class="tab-btn" data-tab="payroll" type="button">Payroll</button>
    </nav>

    <main id="app-root">
      <section id="panel-overview" class="tab-panel active"></section>
      <section id="panel-employees" class="tab-panel"></section>
      <section id="panel-leave" class="tab-panel"></section>
      <section id="panel-payroll" class="tab-panel"></section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/format.js"></script>
  <script src="js/store.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/leave.js"></script>
  <script src="js/payroll.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
