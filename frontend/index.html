<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR &amp; Payroll Tool</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>HR &amp; Payroll Tool</h1>
      <div class="acting-as">
        <label for="acting-as-select">Acting as</label>
        <select id="acting-as-select">
          <option value="">— select an employee —</option>
        </select>
      </div>
    </div>
    <span id="api-status" class="status-pill status-pill--pending">checking API…</span>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="overview" type="button">Overview</button>
    <button class="tab-btn" data-tab="employees" type="button">Employees</button>
    <button class="tab-btn" data-tab="leave" type="button">Leave</button>
    <button class="tab-btn" data-tab="payroll" type="button">Payroll</button>
  </nav>

  <main id="app-root">
    <section id="panel-overview" class="tab-panel active"></section>
    <section id="panel-employees" class="tab-panel"></section>
    <section id="panel-leave" class="tab-panel"></section>
    <section id="panel-payroll" class="tab-panel"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/format.js"></script>
  <script src="js/store.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/leave.js"></script>
  <script src="js/payroll.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
